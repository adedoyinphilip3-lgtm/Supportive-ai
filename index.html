<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #444;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 800px;
      margin: 0 auto 20px;
      padding: 15px 18px;
      border-radius: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #343541;
    }

    .ai {
      background: #2b2b2b;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid #444;
      background: #212121;
    }

    .input-box {
      max-width: 800px;
      margin: auto;
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 50px;
      max-height: 150px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #343541;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 70px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #ccc;
    }
  </style>
</head>

<body>

  <header>My AI</header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>How can I help?</h1>
      <p>Ask me anything.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box">
      <textarea
        id="question"
        placeholder="Message My AI..."
        rows="1"
      ></textarea>

      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    async function askAI() {
      const question = questionInput.value.trim();

      if (!question) return;

      welcome.style.display = "none";

      addMessage(question, "user");

      questionInput.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "...";

      const loading = addMessage("Thinking...", "ai");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
          addMessage(
            data.error || "Something went wrong.",
            "ai"
          );
          return;
        }

        addMessage(data.answer, "ai");

      } catch (error) {
        loading.remove();

        addMessage(
          "I couldn't connect to the AI. Please try again.",
          "ai"
        );

        console.error(error);

      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send";
      }
    }

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    sendButton.addEventListener("click", askAI);

    questionInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        askAI();
      }
    });
  </script>

</body>
</html>
